[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fuzzer-tool"
version = "0.1.0"
description = "Coverage-guided binary fuzzer with Markov chain and Monte Carlo mutations"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Dario Clavijo", email = "clavijodario@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = ["numpy>=2.0","ppmd>=0.1.1"]

[project.optional-dependencies]
smt = ["z3-solver>=4.13"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.3",
    "ruff>=0.4.0",
    "mypy>=1.8",
]
# 2026-11-24 review: plot and json extras for the two soft imports —
# core/campaign_graph.py + cli/commands.py degrade to no-op without
# matplotlib, core/fast_json.py falls back to stdlib json without orjson.
plot = ["matplotlib>=3.8"]
fastjson = ["orjson>=3.9"]

[project.scripts]
fuzzer-tool-after-preload = "fuzzer_tool.cli.commands:main"
fuzzer-tool = "fuzzer_tool.cli.ldpreload_wrapper:main"

[project.urls]
Homepage = "https://github.com/daedalus/fuzzer-tool"
Repository = "https://github.com/daedalus/fuzzer-tool"

[tool.hatch.build.targets.wheel]
packages = ["src/fuzzer_tool"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

# ── mypy ratchet ────────────────────────────────────────────────────────
# `strict = true` above is the target, not the present state. A gate that
# can never go green is a gate nobody reads — the 47 ruff errors and 28
# test failures that survived until the 2026-08-08 review did so behind a
# permanently red CI run.
#
# So the modules below are exempted and everything else is checked strictly.
# New modules are strict by default because they are simply absent from this
# list. Fixing a module means deleting its line here and keeping `mypy src/`
# green — the list only ever shrinks, and CI enforces that it does not grow.
#
# 2026-11-24 re-baseline: the tree grew from 131 to 632 files without the
# ratchet being touched, and 370 of the new modules failed strict (2589
# errors), so `mypy src/` had gone permanently red again. Those 370 were
# added mechanically in one dated re-baseline and the ceiling in
# tests/test_regression_mypy_ratchet.py was raised once to match. The
# historical numbers above (1724/114/131) belong to the 2026-08-08
# introduction. Currently strict: 150/632 files.
[[tool.mypy.overrides]]
module = [
    "fuzzer_tool.adapters.cmp_shm",
    "fuzzer_tool.adapters.cmplog_rec_shm",
    "fuzzer_tool.adapters.edge_pickle",
